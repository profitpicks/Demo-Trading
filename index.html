<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kite Paper Trading | NSE Live</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide-react/dist/umd/lucide-react.min.js"></script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #root {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .text-trading-green { color: #4caf50; }
        .text-trading-red { color: #df514a; }
        .text-trading-blue { color: #4184f3; }
        .bg-trading-blue { background-color: #4184f3; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lot sizes configured exactly as required
        const LOT_SIZES = {
            'NIFTY': 65,
            'SENSEX': 20,
            'FINNIFTY': 120,
            'BANKNIFTY': 30
        };

        const SAMPLE_SCRIPS = [
            { symbol: 'NIFTY', strike: 25000, type: 'CE', ltp: 92.50, exchange: 'NFO' },
            { symbol: 'NIFTY', strike: 25000, type: 'PE', ltp: 88.00, exchange: 'NFO' },
            { symbol: 'BANKNIFTY', strike: 51200, type: 'CE', ltp: 215.40, exchange: 'NFO' },
            { symbol: 'BANKNIFTY', strike: 51200, type: 'PE', ltp: 195.00, exchange: 'NFO' },
            { symbol: 'SENSEX', strike: 81500, type: 'CE', ltp: 140.20, exchange: 'BFO' },
            { symbol: 'SENSEX', strike: 81500, type: 'PE', ltp: 165.80, exchange: 'BFO' },
            { symbol: 'FINNIFTY', strike: 23800, type: 'CE', ltp: 55.40, exchange: 'NFO' },
            { symbol: 'FINNIFTY', strike: 23800, type: 'PE', ltp: 62.10, exchange: 'NFO' }
        ];

        const Icon = ({ name, size = 18, className = "", strokeWidth = 2 }) => {
            const componentName = name.split('-').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join('');
            const lib = window.lucideReact || window.LucideReact;
            const LucideIcon = lib ? lib[componentName] : null;
            return LucideIcon ? <LucideIcon size={size} className={className} strokeWidth={strokeWidth} /> : <span style={{ width: size, height: size }} />;
        };

        function App() {
            const [activeTab, setActiveTab] = useState('positions');
            const [isSyncing, setIsSyncing] = useState(false);
            const [showOrderModal, setShowOrderModal] = useState(false);
            const [showSearchModal, setShowSearchModal] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            
            const [marketIndices, setMarketIndices] = useState([
                { name: 'NIFTY 50', value: '24,960.50', change: '+52.10', isNegative: false },
                { name: 'SENSEX', value: '81,520.30', change: '+180.40', isNegative: false },
                { name: 'BANK NIFTY', value: '51,340.20', change: '-45.30', isNegative: true },
                { name: 'FINNIFTY', value: '23,810.00', change: '+12.50', isNegative: false }
            ]);

            // Persisted Positions in LocalStorage
            const [positions, setPositions] = useState(() => {
                const saved = localStorage.getItem('paper_positions');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) {}
                }
                return [
                    { id: '1', symbol: 'NIFTY', expiry: 'OCT', strike: 25000, optionType: 'CE', lots: 1, lotSize: 65, qty: 65, avgPrice: 92.50, ltp: 96.20, product: 'MIS', exchange: 'NFO' }
                ];
            });

            // Order Placement Form State
            const [orderForm, setOrderForm] = useState({
                symbol: 'NIFTY',
                strike: 25000,
                optionType: 'CE',
                lots: 1,
                orderType: 'MARKET',
                customPrice: 92.50,
                product: 'MIS',
                exchange: 'NFO'
            });

            useEffect(() => {
                localStorage.setItem('paper_positions', JSON.stringify(positions));
            }, [positions]);

            // Live Feed Simulation / NSE Call via CORS Proxy
            const fetchNSELiveFeed = async () => {
                setIsSyncing(true);
                try {
                    const nseUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent("https://www.nseindia.com/api/option-chain-indices?symbol=NIFTY");
                    const res = await fetch(nseUrl);
                    const json = await res.json();
                    const nseData = JSON.parse(json.contents);
                    
                    if (nseData?.records?.data) {
                        const records = nseData.records.data;
                        setPositions(prev => prev.map(pos => {
                            if (pos.symbol === 'NIFTY') {
                                const match = records.find(r => r.strikePrice === Number(pos.strike));
                                if (match) {
                                    const opt = pos.optionType === 'CE' ? match.CE : match.PE;
                                    if (opt?.lastPrice) return { ...pos, ltp: opt.lastPrice };
                                }
                            }
                            return pos;
                        }));
                    }
                } catch (err) {
                    // Micro-fluctuation fallback for realistic ticks
                    setPositions(prev => prev.map(p => ({
                        ...p,
                        ltp: +(Math.max(1, p.ltp + (Math.random() * 1.6 - 0.8))).toFixed(2)
                    })));
                } finally {
                    setIsSyncing(false);
                }
            };

            useEffect(() => {
                fetchNSELiveFeed();
                const timer = setInterval(fetchNSELiveFeed, 6000);
                return () => clearInterval(timer);
            }, []);

            // Total P&L Calculation
            const positionsWithPnl = positions.map(p => {
                const pnl = (p.ltp - p.avgPrice) * p.qty;
                return { ...p, pnl: Math.round(pnl * 100) / 100 };
            });

            const totalPnl = positionsWithPnl.reduce((sum, item) => sum + item.pnl, 0);

            // Execute Order
            const handleExecuteOrder = (e) => {
                e.preventDefault();
                const lotSize = LOT_SIZES[orderForm.symbol] || 65;
                const totalQty = Number(orderForm.lots) * lotSize;
                const execPrice = Number(orderForm.customPrice);

                const newPosition = {
                    id: Date.now().toString(),
                    symbol: orderForm.symbol,
                    expiry: 'WEEKLY',
                    strike: Number(orderForm.strike),
                    optionType: orderForm.optionType,
                    lots: Number(orderForm.lots),
                    lotSize: lotSize,
                    qty: totalQty,
                    avgPrice: execPrice,
                    ltp: execPrice,
                    product: orderForm.product,
                    exchange: orderForm.exchange
                };

                setPositions(prev => [newPosition, ...prev]);
                setShowOrderModal(false);
            };

            const handleSelectScrip = (scrip) => {
                setOrderForm(prev => ({
                    ...prev,
                    symbol: scrip.symbol,
                    strike: scrip.strike,
                    optionType: scrip.type,
                    customPrice: scrip.ltp,
                    exchange: scrip.exchange,
                    lots: 1
                }));
                setShowSearchModal(false);
                setShowOrderModal(true);
            };

            const filteredScrips = SAMPLE_SCRIPS.filter(s => {
                const query = searchQuery.toUpperCase();
                const fullName = `${s.symbol} ${s.strike} ${s.type}`;
                return fullName.includes(query) || s.symbol.includes(query) || s.strike.toString().includes(query);
            });

            const currentActiveLotSize = LOT_SIZES[orderForm.symbol] || 65;
            const currentTotalQty = orderForm.lots * currentActiveLotSize;

            return (
                <div className="h-full w-full max-w-[420px] bg-white relative overflow-hidden flex flex-col shadow-2xl border border-gray-100">
                    
                    {/* Status Bar */}
                    <div className="h-8 shrink-0 flex items-center justify-between px-5 text-[11px] font-semibold text-gray-800 border-b border-gray-50">
                        <span>09:45 AM</span>
                        <div className="flex gap-2 items-center">
                            <span className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-amber-400 animate-ping' : 'bg-emerald-500'}`}></span>
                            <span>{isSyncing ? 'Updating Feeds...' : 'Live Connected'}</span>
                            <Icon name="wifi" size={13} />
                        </div>
                    </div>

                    {/* Top Indices Scrolling Bar */}
                    <header className="shrink-0 bg-white px-4 py-2 border-b border-gray-100">
                        <div className="flex items-center justify-between">
                            <div className="flex gap-5 overflow-x-auto no-scrollbar">
                                {marketIndices.map((idx, i) => (
                                    <div key={i} className="flex flex-col shrink-0">
                                        <span className="text-[11px] font-bold text-gray-500">{idx.name}</span>
                                        <div className="flex items-center gap-1.5">
                                            <span className={`text-[12px] font-bold ${idx.isNegative ? 'text-trading-red' : 'text-trading-green'}`}>
                                                {idx.value}
                                            </span>
                                            <span className="text-[10px] text-gray-400">{idx.change}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <button onClick={fetchNSELiveFeed} className="p-1 hover:bg-gray-100 rounded-full text-gray-600 ml-2">
                                <Icon name="refresh-cw" size={14} className={isSyncing ? "animate-spin" : ""} />
                            </button>
                        </div>
                    </header>

                    {/* Scrollable Main Area */}
                    <div className="flex-1 overflow-y-auto no-scrollbar pb-24">
                        
                        {/* Tab Headers */}
                        <div className="flex justify-center border-b border-gray-100 sticky top-0 bg-white z-10">
                            <div className="flex gap-10">
                                <button onClick={() => setActiveTab('holdings')} className={`py-3 px-2 text-[14px] font-semibold relative ${activeTab === 'holdings' ? 'text-trading-blue' : 'text-gray-400'}`}>
                                    Holdings
                                    {activeTab === 'holdings' && <div className="absolute bottom-0 left-0 right-0 h-0.5 bg-trading-blue"></div>}
                                </button>
                                <button onClick={() => setActiveTab('positions')} className={`py-3 px-2 text-[14px] font-semibold relative flex items-center gap-1.5 ${activeTab === 'positions' ? 'text-trading-blue' : 'text-gray-400'}`}>
                                    Positions
                                    <span className="w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-bold bg-trading-blue text-white">
                                        {positions.length}
                                    </span>
                                    {activeTab === 'positions' && <div className="absolute bottom-0 left-0 right-0 h-0.5 bg-trading-blue"></div>}
                                </button>
                            </div>
                        </div>

                        {/* Total P&L Card */}
                        <div className="px-4 py-4">
                            <div className="bg-white border border-gray-100 rounded-md py-6 shadow-sm text-center">
                                <span className="text-[12px] font-medium text-gray-400 tracking-wide uppercase mb-1 block">Total P&L</span>
                                <h2 className={`text-[30px] font-bold tracking-tight ${totalPnl >= 0 ? 'text-trading-green' : 'text-trading-red'}`}>
                                    {totalPnl >= 0 ? '+' : ''}{totalPnl.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                </h2>
                            </div>
                        </div>

                        {/* Search Toolbar */}
                        <div className="flex items-center justify-between px-4 py-2 border-b border-gray-50">
                            <button 
                                onClick={() => setShowSearchModal(true)} 
                                className="flex items-center gap-2 text-xs font-semibold text-gray-600 bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-md transition">
                                <Icon name="search" size={14} className="text-trading-blue" />
                                <span>Search Scrip (Nifty, Sensex...)</span>
                            </button>
                            
                            <button 
                                onClick={() => setShowOrderModal(true)} 
                                className="bg-trading-blue text-white text-[11px] font-bold px-3 py-1.5 rounded flex items-center gap-1 shadow hover:opacity-90">
                                <Icon name="plus" size={14} /> Buy Scrip
                            </button>
                        </div>

                        {/* Positions List */}
                        <div className="divide-y divide-gray-100">
                            {positionsWithPnl.map(pos => {
                                const isPos = pos.pnl >= 0;
                                return (
                                    <div key={pos.id} className="py-3.5 px-4 hover:bg-gray-50/70 transition flex justify-between items-start">
                                        <div>
                                            <div className="flex items-center gap-1.5 mb-1 text-[11px] text-gray-400 font-medium">
                                                <span className="font-bold text-gray-700">{pos.lots} {pos.lots > 1 ? 'Lots' : 'Lot'}</span>
                                                <span>({pos.qty} Qty @ {pos.lotSize}/lot)</span>
                                                <span>•</span>
                                                <span>Avg. ₹{pos.avgPrice.toFixed(2)}</span>
                                            </div>
                                            <div className="flex items-center gap-1 font-semibold text-[13px] text-gray-800">
                                                <span>{pos.symbol}</span>
                                                <span className="bg-blue-50 text-trading-blue px-1 text-[9px] rounded font-bold">W</span>
                                                <span>{pos.strike}</span>
                                                <span className={pos.optionType === 'CE' ? 'text-emerald-600 font-bold' : 'text-rose-600 font-bold'}>{pos.optionType}</span>
                                            </div>
                                            <div className="flex items-center gap-2 mt-1">
                                                <span className="text-[10px] bg-gray-100 text-gray-500 px-1 py-0.5 rounded font-bold uppercase">{pos.exchange}</span>
                                                <button 
                                                    onClick={() => setPositions(prev => prev.filter(p => p.id !== pos.id))} 
                                                    className="text-[10px] text-red-500 hover:underline font-semibold">
                                                    Square-off
                                                </button>
                                            </div>
                                        </div>
                                        <div className="flex flex-col items-end">
                                            <span className="text-[10px] text-amber-600 bg-amber-50 px-1 rounded font-bold uppercase mb-1">{pos.product}</span>
                                            <span className={`text-[14px] font-bold ${isPos ? 'text-trading-green' : 'text-trading-red'}`}>
                                                {isPos ? '+' : ''}{pos.pnl.toLocaleString('en-IN', { minimumFractionDigits: 2 })}
                                            </span>
                                            <div className="text-[11px] text-gray-500 mt-1 font-medium">
                                                LTP ₹{pos.ltp.toFixed(2)}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* SEARCH SCRIP MODAL */}
                    {showSearchModal && (
                        <div className="absolute inset-0 bg-black/60 z-50 flex items-start justify-center p-3">
                            <div className="bg-white w-full rounded-xl p-4 shadow-2xl mt-8 max-h-[80vh] flex flex-col">
                                <div className="flex justify-between items-center pb-2 border-b">
                                    <div className="flex items-center gap-2 flex-1">
                                        <Icon name="search" size={16} className="text-gray-400" />
                                        <input 
                                            type="text" 
                                            placeholder="Search eg: NIFTY, SENSEX, FINNIFTY..."
                                            value={searchQuery}
                                            onChange={e => setSearchQuery(e.target.value)}
                                            className="w-full text-xs font-semibold focus:outline-none"
                                            autoFocus
                                        />
                                    </div>
                                    <button onClick={() => setShowSearchModal(false)}><Icon name="x" size={18} /></button>
                                </div>
                                <div className="overflow-y-auto no-scrollbar divide-y divide-gray-100 flex-1 mt-2">
                                    {filteredScrips.map((item, idx) => (
                                        <div 
                                            key={idx} 
                                            onClick={() => handleSelectScrip(item)} 
                                            className="py-2.5 px-2 hover:bg-blue-50 cursor-pointer flex justify-between items-center rounded transition">
                                            <div>
                                                <div className="text-xs font-bold text-gray-800">
                                                    {item.symbol} {item.strike} <span className={item.type === 'CE' ? 'text-emerald-600' : 'text-rose-600'}>{item.type}</span>
                                                </div>
                                                <div className="text-[10px] text-gray-400">
                                                    {item.exchange} • 1 Lot = <span className="font-bold text-gray-700">{LOT_SIZES[item.symbol]} Qty</span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-xs font-bold text-gray-700">₹{item.ltp.toFixed(2)}</span>
                                                <span className="block text-[9px] text-trading-blue font-bold">SELECT &rarr;</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ORDER EXECUTION MODAL */}
                    {showOrderModal && (
                        <div className="absolute inset-0 bg-black/50 z-50 flex items-end">
                            <div className="bg-white w-full rounded-t-2xl p-5 shadow-2xl">
                                <div className="flex justify-between items-center mb-3">
                                    <div>
                                        <h3 className="text-sm font-bold text-gray-900">
                                            {orderForm.symbol} {orderForm.strike} {orderForm.optionType}
                                        </h3>
                                        <span className="text-[11px] text-trading-blue font-semibold">
                                            Lot Size: {currentActiveLotSize} Qty/Lot
                                        </span>
                                    </div>
                                    <button onClick={() => setShowOrderModal(false)}><Icon name="x" size={18} /></button>
                                </div>

                                <form onSubmit={handleExecuteOrder} className="space-y-3">
                                    {/* Index Selector */}
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[10px] font-bold text-gray-500">INDEX</label>
                                            <select 
                                                className="w-full border rounded p-1.5 text-xs font-semibold"
                                                value={orderForm.symbol} 
                                                onChange={e => {
                                                    const sym = e.target.value;
                                                    setOrderForm({
                                                        ...orderForm, 
                                                        symbol: sym,
                                                        exchange: sym === 'SENSEX' ? 'BFO' : 'NFO'
                                                    });
                                                }}>
                                                <option value="NIFTY">NIFTY (Lot: 65)</option>
                                                <option value="SENSEX">SENSEX (Lot: 20)</option>
                                                <option value="FINNIFTY">FINNIFTY (Lot: 120)</option>
                                                <option value="BANKNIFTY">BANKNIFTY (Lot: 30)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-gray-500">OPTION TYPE</label>
                                            <select 
                                                className="w-full border rounded p-1.5 text-xs font-semibold"
                                                value={orderForm.optionType} 
                                                onChange={e => setOrderForm({...orderForm, optionType: e.target.value})}>
                                                <option value="CE">Call (CE)</option>
                                                <option value="PE">Put (PE)</option>
                                            </select>
                                        </div>
                                    </div>

                                    {/* Lots & Auto Quantity */}
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-[10px] font-bold text-gray-500">NUMBER OF LOTS</label>
                                            <input 
                                                type="number" 
                                                min="1"
                                                max="100"
                                                className="w-full border rounded p-1.5 text-xs font-bold focus:border-blue-500 outline-none"
                                                value={orderForm.lots} 
                                                onChange={e => setOrderForm({...orderForm, lots: Math.max(1, parseInt(e.target.value) || 1)})} 
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-gray-500">TOTAL QUANTITY (AUTO)</label>
                                            <input 
                                                type="text" 
                                                readOnly
                                                className="w-full border rounded p-1.5 text-xs font-bold bg-blue-50 text-trading-blue outline-none border border-blue-100"
                                                value={`${currentTotalQty} Qty (${orderForm.lots} × ${currentActiveLotSize})`} 
                                            />
                                        </div>
                                    </div>

                                    {/* Execution Price Input */}
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500">EXECUTION PRICE (₹)</label>
                                        <input 
                                            type="number" 
                                            step="0.05"
                                            className="w-full border rounded p-1.5 text-xs font-bold outline-none focus:border-blue-500"
                                            value={orderForm.customPrice} 
                                            onChange={e => setOrderForm({...orderForm, customPrice: e.target.value})} 
                                        />
                                    </div>

                                    {/* Capital Required Summary */}
                                    <div className="flex justify-between items-center text-[11px] text-gray-500 pt-1 border-t">
                                        <span>Virtual Capital Needed:</span>
                                        <span className="font-bold text-gray-900">
                                            ₹{(currentTotalQty * Number(orderForm.customPrice)).toLocaleString('en-IN', { minimumFractionDigits: 2 })}
                                        </span>
                                    </div>

                                    <button 
                                        type="submit" 
                                        className="w-full py-2.5 bg-trading-blue hover:bg-blue-600 text-white rounded-md font-bold text-xs uppercase tracking-wider shadow transition">
                                        BUY {currentTotalQty} QTY ({orderForm.lots} {orderForm.lots > 1 ? 'LOTS' : 'LOT'})
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Bottom Navigation */}
                    <nav className="shrink-0 h-[65px] bg-white border-t border-gray-100 flex items-center justify-around px-2">
                        <button onClick={() => setShowSearchModal(true)} className="flex flex-col items-center gap-1 text-gray-400 hover:text-trading-blue">
                            <Icon name="search" size={18} />
                            <span className="text-[10px] font-medium">Search</span>
                        </button>
                        <button className="flex flex-col items-center gap-1 text-gray-400">
                            <Icon name="clipboard-list" size={18} />
                            <span className="text-[10px] font-medium">Orders</span>
                        </button>
                        <button className="flex flex-col items-center gap-1 text-trading-blue">
                            <Icon name="briefcase" size={18} />
                            <span className="text-[10px] font-bold">Portfolio</span>
                        </button>
                        <button className="flex flex-col items-center gap-1 text-gray-400">
                            <Icon name="user" size={18} />
                            <span className="text-[10px] font-medium">User</span>
                        </button>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
